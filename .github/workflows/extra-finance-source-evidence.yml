name: Extra Finance source evidence
on:
  pull_request:
    paths:
      - 'scripts/check_extra_lendingpool_source.py'
      - 'scripts/anchor_hunt_readiness.py'
      - 'scripts/anchor_trinity_handoff.py'
      - 'scripts/anchor_deployment_provenance.py'
      - 'scripts/extra_verified_source_compile.py'
      - 'scripts/extra_rpc_bytecode_attestation.py'
      - 'scripts/extra_runtime_transform_reconciliation.py'
      - 'scripts/extra_verified_runtime_fixture.py'
      - 'tests/extra_runtime_lab/ExtraVerifiedRuntimeSmoke.t.sol'
      - 'tests/test_extra_runtime_transform_reconciliation.py'
      - 'tests/test_extra_rpc_bytecode_attestation.py'
      - 'tests/test_extra_verified_source_compile.py'
      - 'tests/test_anchor_deployment_provenance.py'
      - 'tests/test_anchor_trinity_handoff.py'
      - 'tests/test_anchor_hunt_readiness.py'
      - 'scripts/extra_verified_source_hunk_review.py'
      - 'tests/test_extra_verified_source_hunk_review.py'
      - 'tests/test_extra_lendingpool_source_verifier.py'
      - 'hunts/extra-finance-lendingpool-intake-2026-11-03.md'
      - '.github/workflows/extra-finance-source-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout ANCHOR
        uses: actions/checkout@v4
      - name: Checkout pinned ExtraFi source
        uses: actions/checkout@v4
        with:
          repository: ExtraFi/extra-contracts
          ref: a66e925d78ee5c990eb2bafa5009cebcbeafe42d
          path: .source-extrafi
          persist-credentials: false
      - name: Verify pinned upstream commit
        run: |
          test "$(git -C .source-extrafi rev-parse HEAD)" = "a66e925d78ee5c990eb2bafa5009cebcbeafe42d"
      - name: Run offline verifier unit tests
        run: python -m unittest discover -s tests -p test_extra_lendingpool_source_verifier.py -q
      - name: Compare read-only public verified source
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python scripts/check_extra_lendingpool_source.py \
            --source .source-extrafi/contracts/lendingpool/LendingPool.sol \
            > evidence/extra-lendingpool-source-verification.json
          code=$?
          set -e
          cat > .extra-runtime-lab/foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.18"
          TOML
          # The ~40 KiB runtime stays in a local env var; never echo it in logs.
          runtime=$(cat evidence/extra-local-runtime/runtime.hex)
          registry=$(python -c 'import json; print(json.load(open("evidence/extra-local-runtime/fixture.json"))["registry_address"])')
          EXTRA_RUNTIME="$runtime" EXTRA_REGISTRY="$registry" \
            forge test --root .extra-runtime-lab \
              --match-test test_DeployedRuntimeReturnsImmutableRegistry -vv
      - name: Validate Trinity handoff tests
        run: python -m pytest tests/test_anchor_trinity_handoff.py -q
      - name: Archive blocked research signal for Trinity
        shell: bash
        run: |
          python scripts/anchor_trinity_handoff.py \
            --readiness evidence/extra-hunt-readiness.json \
            --source-evidence evidence/extra-lendingpool-source-verification.json \
            --build-evidence evidence/extra-verified-build.json \
            --rpc-evidence evidence/extra-independent-bytecode.json \
            --output evidence/extra-trinity-signal.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence/extra-trinity-signal.json").read_text())
          assert payload["handoff_status"] == "BLOCKED_RESEARCH_SIGNAL", payload["handoff_status"]
          assert payload["lead"]["state"] == "signal"
          assert payload["lead"]["scope_status"] == "unknown"
          assert payload["finding"] == "NONE"
          assert payload["authorization_grant_issued"] is False
          print("Expected blocked Trinity research signal recorded; no finding promoted")
          PY
      - name: Upload source comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-lendingpool-source-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
