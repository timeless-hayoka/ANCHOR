name: Extra Finance source evidence
on:
  pull_request:
    paths:
      - 'scripts/check_extra_lendingpool_source.py'
      - 'scripts/anchor_hunt_readiness.py'
      - 'scripts/anchor_trinity_handoff.py'
      - 'scripts/anchor_deployment_provenance.py'
      - 'tests/test_anchor_deployment_provenance.py'
      - 'tests/test_anchor_trinity_handoff.py'
      - 'tests/test_anchor_hunt_readiness.py'
      - 'scripts/extra_verified_source_hunk_review.py'
      - 'tests/test_extra_verified_source_hunk_review.py'
      - 'tests/test_extra_lendingpool_source_verifier.py'
      - 'hunts/extra-finance-lendingpool-intake-2026-11-03.md'
      - '.github/workflows/extra-finance-source-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout ANCHOR
        uses: actions/checkout@v4
      - name: Checkout pinned ExtraFi source
        uses: actions/checkout@v4
        with:
          repository: ExtraFi/extra-contracts
          ref: a66e925d78ee5c990eb2bafa5009cebcbeafe42d
          path: .source-extrafi
          persist-credentials: false
      - name: Verify pinned upstream commit
        run: |
          test "$(git -C .source-extrafi rev-parse HEAD)" = "a66e925d78ee5c990eb2bafa5009cebcbeafe42d"
      - name: Run offline verifier unit tests
        run: python -m unittest discover -s tests -p test_extra_lendingpool_source_verifier.py -q
      - name: Compare read-only public verified source
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          python scripts/check_extra_lendingpool_source.py \
            --source .source-extrafi/contracts/lendingpool/LendingPool.sol \
            > evidence/extra-lendingpool-source-verification.json
          code=$?
          set -e
          printf '%s\n' "$code" > evidence/source-verifier-exit-code.txt
          cat evidence/extra-lendingpool-source-verification.json
          if [ "$code" -eq 0 ]; then
            echo "Exact runtime verified source file matched; full build/bytecode equivalence remains unverified."
          elif [ "$code" -eq 3 ]; then
            echo "::warning::Source file matched a nonexact Sourcify runtime verification; full bytecode equivalence remains unverified."
          else
            echo "::warning::Sourcify source comparison unavailable/mismatched (exit $code); do not promote source equivalence."
          fi
      - name: Validate bounded hunk report
        run: python -m unittest discover -s tests -p test_extra_verified_source_hunk_review.py -q
      - name: Capture changed source lines for manual review
        shell: bash
        run: |
          set +e
          python scripts/extra_verified_source_hunk_review.py \
            --source .source-extrafi/contracts/lendingpool/LendingPool.sol \
            > evidence/extra-lendingpool-hunk-review.json
          code=$?
          set -e
          cat evidence/extra-lendingpool-hunk-review.json
          if [ "$code" -ne 0 ]; then
            echo "::warning::Verified-source hunk review unavailable; evidence incomplete."
          fi
      - name: Record fail-closed ANCHOR hunt readiness
        shell: bash
        run: |
          # No reviewer-approved scope confirmation or verified Finder selection
          # is provided here. The correct outcome for this real target is BLOCKED.
          set +e
          python scripts/anchor_hunt_readiness.py \
            --target-id ExtraFi/extra-contracts \
            --target-ref a66e925d78ee5c990eb2bafa5009cebcbeafe42d \
            --chain-id 10 \
            --contract-address 0xbb505c54d71e9e599cb8435b4f0ceec05fc71cbd \
            --source-evidence evidence/extra-lendingpool-source-verification.json \
            --output evidence/extra-hunt-readiness.json
          code=$?
          set -e
          cat evidence/extra-hunt-readiness.json
          if [ "$code" -ne 2 ]; then
            echo "::error::Extra Finance readiness unexpectedly unblocked or errored (exit $code)."
            exit 1
          fi
          echo "::notice::Extra Finance readiness remains blocked pending complete scope and source evidence."
      - name: Capture read-only deployed compiler provenance
        shell: bash
        run: |
          set +e
          python scripts/anchor_deployment_provenance.py \
            --output evidence/extra-deployment-provenance.json
          code=$?
          set -e
          echo "Sourcify provider provenance exit code: $code"
          # Missing provider response is a negative evidence result, not an
          # independently verified deployment or a bug. Keep the JSON artifact.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit 1
          fi
      - name: Validate Trinity handoff tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest tests/test_anchor_trinity_handoff.py -q
      - name: Archive blocked research signal for Trinity
        shell: bash
        run: |
          python scripts/anchor_trinity_handoff.py \
            --readiness evidence/extra-hunt-readiness.json \
            --source-evidence evidence/extra-lendingpool-source-verification.json \
            --output evidence/extra-trinity-signal.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence/extra-trinity-signal.json").read_text())
          assert payload["handoff_status"] == "BLOCKED_RESEARCH_SIGNAL", payload["handoff_status"]
          assert payload["lead"]["state"] == "signal"
          assert payload["lead"]["scope_status"] == "unknown"
          assert payload["finding"] == "NONE"
          assert payload["authorization_grant_issued"] is False
          print("Expected blocked Trinity research signal recorded; no finding promoted")
          PY
      - name: Upload source comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extra-lendingpool-source-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
