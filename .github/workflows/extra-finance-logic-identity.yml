name: Extra historical vault logic identity (read-only)
on:
  pull_request:
    paths:
      - 'tests/extra_historical_fork/AnchorExtraHistoricalLogicIdentity.t.sol'
      - 'tests/test_extra_historical_logic_identity.py'
      - '.github/workflows/extra-finance-logic-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-logic-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Compile without RPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .extra-logic-identity/test
          cp tests/extra_historical_fork/AnchorExtraHistoricalLogicIdentity.t.sol .extra-logic-identity/test/
          cat > .extra-logic-identity/foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.18"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          TOML
          forge build --root .extra-logic-identity

  archived-logic-readout:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'research/extra-logic-identity-readout-20261104')
    needs: compile-logic-identity
    concurrency:
      group: extra-historical-logic-registry-rpc
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OP_READONLY_RPC: https://mainnet.optimism.io
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Run pinned archive-only getter calls
        shell: bash
        run: |
          set -euo pipefail
          test "$(cast chain-id --rpc-url "$OP_READONLY_RPC")" = "10"
          mkdir -p .extra-logic-identity/test evidence
          cp tests/extra_historical_fork/AnchorExtraHistoricalLogicIdentity.t.sol .extra-logic-identity/test/
          cat > .extra-logic-identity/foundry.toml <<'TOML'
          [profile.default]
          src = "src"
          test = "test"
          solc_version = "0.8.18"
          optimizer = true
          optimizer_runs = 200
          via_ir = true
          TOML
          printf '{"chain_id":10,"block":120000000,"vault_id":3,"read_only":true,"eligibility":"UNKNOWN"}\n' > evidence/logic_identity_provenance.json
          forge test --root .extra-logic-identity \
            --fork-url "$OP_READONLY_RPC" --fork-block-number 120000000 \
            --match-contract AnchorExtraHistoricalLogicIdentityTest -vv \
            2>&1 | tee evidence/logic_identity.log
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-extra-logic-identity
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
